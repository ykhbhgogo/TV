# 工作流名称
name: Build Android APK

# 触发条件：push 到 main 分支、创建 release 时触发
on:
  push:
    branches: [ main ]
  release:
    types: [created]

# 工作流任务
jobs:
  build:
    # 运行环境：Ubuntu 最新版
    runs-on: ubuntu-latest

    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：配置 JDK 环境（Android 构建需要 JDK 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 步骤3：配置 Android SDK 环境
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 步骤4：授予 gradlew 执行权限（Linux 环境）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 步骤5：构建调试版 APK（如果需要正式版，见下方说明）
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 步骤6：上传 APK 作为构建产物（方便下载）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 可选步骤：如果创建 Release，自动将 APK 附加到 Release 中
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/debug/app-debug.apk
          asset_name: app-debug.apk
          tag: ${{ github.ref }}
          overwrite: true
